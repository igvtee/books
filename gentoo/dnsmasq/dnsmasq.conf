port=53

domain-needed
bogus-priv
filterwin2k
no-resolv
no-hosts
dhcp-authoritative
#no-negcache
neg-ttl=3600

server=192.168.87.1
interface=enp5s0
interface=enp6s0
#bind-interfaces
bind-dynamic

enable-ra

#dchp-host=aa:bb:cc:dd:ee:ff,192.168.10.20

# =====================================
# Interface 1: enp5s0
# IPv4: 192.168.50.0/24
# IPv6: fd10:50::/64
# =====================================

# DHCPv4 range
dhcp-range=set:lan1,192.168.50.100,192.168.50.200,255.255.255.0,12h

# DHCPv4 options
dhcp-option=tag:lan1,option:router,192.168.50.1
dhcp-option=tag:lan1,option:dns-server,192.168.50.1
#dhcp-option=tag:lan1,option:domain-name,lan1

# DHCPv6 range
dhcp-range=::,constructor:enp5s0,ra-stateless,64,12h

# DHCPv6 options
#dhcp-option=tag:lan1,option6:dns-server,[fd10:50::1]

# ra options
#ra-param=enp5s0,mtu:1500
# ra interval
#ra-param=enp5s0,60

# =====================================
# Interface 2: enp6s0
# IPv4: 192.168.60.0/24
# IPv6: fd10:60::/64
# =====================================

# DHCPv4 range
dhcp-range=set:lan2,192.168.60.100,192.168.60.200,255.255.255.0,12h

# DHCPv4 options
dhcp-option=tag:lan2,option:router,192.168.60.1
dhcp-option=tag:lan2,option:dns-server,192.168.60.1
#dhcp-option=tag:lan2,option:domain-name,lan2

# DHCPv6 range
dhcp-range=::,constructor:enp6s0,ra-stateless,64,12h

# DHCPv6 options
#dhcp-option=tag:lan2,option6:dns-server,[fd10:60::1]

# ra options
#ra-param=enp6s0,mtu:1500
# ra interval
#ra-param=enp6s0,60
